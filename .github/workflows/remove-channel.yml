name: Remove sheikh channel

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "UC… id of the channel to remove"
        required: true
        type: string
      confirm:
        description: "Type REMOVE to confirm — anything else aborts"
        required: true
        type: string

permissions:
  contents: write

# Shared with add-channel.yml on purpose: both jobs rewrite sheikhs.json, so an add
# and a remove running at the same time would lose one of the two edits.
concurrency:
  group: channel-mutation
  cancel-in-progress: false

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Remove channel from sheikhs.json
        id: remove
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: python scripts/remove_channel.py

      - name: Commit and push
        if: steps.remove.outputs.removed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sheikhs.json channels
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: remove channel via workflow"
            git push
          fi
